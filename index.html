s+=hdl(440,jt+18,640,ty,gi('cr').c1,gi('cr').c2)+hdl(440,bt+18,640,by,gi('cr').c1,gi('cr').c2)+fist(590,ty-6,60,by-ty+12,'r');
s+=`<rect x="160" y="284" width="400" height="14" rx="7" fill="#dde6f1"/><rect x="${160+400*.7}" y="284" width="${400*.25}" height="14" fill="#f0c030" opacity=".7"/><rect x="${160+400*.95}" y="284" width="${400*.05}" height="14" fill="#22b573"/><rect x="160" y="284" width="${400*p}" height="14" rx="7" fill="${LB}"/>`;
if(S.cdone)s+='<text x="200" y="120" text-anchor="middle" font-size="22" style="fill:#0a8f4d">CLICK! ✓</text>';return s}
function plug(i,x,y){const d=i?-1:1;return `<g data-pl="${i}" style="cursor:grab" transform="translate(${x} ${y}) scale(${d} 1)"><rect x="0" y="-9" width="14" height="18" fill="#dff0ff" fill-opacity=".9" stroke="#5aa0e0"/><rect x="14" y="-13" width="26" height="26" rx="3" fill="#dff0ff" fill-opacity=".85" stroke="#5aa0e0" stroke-width="2"/><path d="M2 -5H12M2 0H12M2 5H12" stroke="#e0a800" stroke-width="2"/><rect x="38" y="-12" width="22" height="24" rx="6" fill="#4aa3ff" stroke="${LB}" stroke-width="1.5"/></g><text x="${x+d*30}" y="${y+32}" text-anchor="middle" font-size="10">ปลาย ${i+1}</text>`}
function unit(x,t,lbl,leds,sock){let s=`<rect x="${x}" y="24" width="172" height="150" rx="14" fill="#fff" stroke="#b9c8dc" stroke-width="2"/><path d="M${x} 54V38A14 14 0 0 1 ${x+14} 24H${x+158}A14 14 0 0 1 ${x+172} 38V54Z" fill="${gi('ts').c1}"/><text x="${x+14}" y="45" style="fill:#fff;font-weight:700;font-size:13px">${gi('ts').lab}</text><text x="${x+158}" y="45" text-anchor="end" style="fill:#cfe2ff;font-size:9px">${lbl}</text><rect x="${sock}" y="92" width="16" height="36" rx="3" fill="#2a3340"/>`;
for(let i=0;i<8;i++)s+=`<circle cx="${x+20+i*17}" cy="68" r="6" fill="${leds[i]}" stroke="#b9c8dc"/><text x="${x+20+i*17}" y="83" text-anchor="middle" font-size="8">${i+1}</text>`;return s}
function d6(){const a=S.pp[0],b=S.pp[1],E=CAB[P.cable].e,off='#e1e8f1',ok='#22b573',ng='#e5484d';let s=DEFS;
const done=S.fdone||S.log.length>2,lcd=done?(S.link==0?'FAIL':S.split?'SPLIT PAIR':'PASS '+S.link+'M'):S.testing?`TEST ${S.tstep}/8`:S.ready?'READY':'NO CABLE';
const L=[],R=[];for(let i=0;i<8;i++){const on=i<S.tstep,fj=[...Array(S.tstep).keys()].filter(j=>K(j)==i);L.push(on?(K(i)==X(i)?ok:ng):off);R.push(fj.length?(fj.every(j=>K(j)==X(j))?ok:ng):off)}
s+=unit(14,0,'TX-1302 · '+E[0],L,186)+unit(534,0,'REMOTE · '+E[1],R,520);
s+=`<rect x="34" y="94" width="132" height="22" rx="4" fill="#0e2a2a"/><text x="100" y="109" text-anchor="middle" style="fill:${S.link==0&&done?'#ff9a9a':'#7dffd0'};font-size:11px">${lcd}</text><g data-t="1" style="cursor:pointer"><rect x="34" y="128" width="70" height="30" rx="15" fill="${S.ready&&!S.testing?LB:'#c9d4e3'}"/><text x="69" y="148" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">TEST</text></g>`;
const x0=a.x+58,x1=b.x-58,c=`M${x0},${a.y} C${x0+80},${a.y+95} ${x1-80},${b.y+95} ${x1},${b.y}`;
s+=`<path d="${c}" fill="none" stroke="#2f5fae" stroke-width="12" stroke-linecap="round"/><path d="${c}" fill="none" stroke="#6aa9ee" stroke-width="8" stroke-linecap="round"/>`+plug(0,a.x,a.y)+plug(1,b.x,b.y);
if(!S.ready&&!S.testing)s+='<text x="360" y="304" text-anchor="middle" font-size="12" style="fill:#b87400">ลากหัวสายแต่ละปลายไปเสียบช่องของเครื่องเทส</text>';
return s}
function spark(){const pa=S.pa||[],n=S.pc||0,mx=Math.max(1,...pa.filter(v=>v!=null));let s='';
for(let i=0;i<10;i++){const x=12+i*28;if(i>=n){s+=`<rect x="${x}" y="54" width="18" height="2" fill="#1d3a4f"/>`;continue}const v=pa[i];
s+=v==null?`<text x="${x+9}" y="40" text-anchor="middle" style="fill:#ff6b6b!important;font-size:18px">✕</text>`:`<rect x="${x}" y="${56-v/mx*44}" width="18" height="${v/mx*44}" rx="2" fill="#7dffb0"/><text x="${x+9}" y="${50-v/mx*44}" text-anchor="middle" style="font-size:8px">${v}</text>`}
return `<div class="ping">📡 PING 192.168.1.1 · latency (ms) · ✕ = packet loss<svg viewBox="0 0 300 62">${s}</svg></div>`}
function ctl(){const n=S.step;
if(n==2)return `${tut()?'':`<button class="b" onclick="if(!S.hint&&!S.hu){S.hu=1;S.hintUsed++}S.hint=!S.hint;draw()">📋 ${S.hint?'ซ่อน':'ดู'} pinout</button>`}<button class="b" onclick="if(S.hist.length)S.order=S.hist.pop();draw()">↩ ย้อนกลับ</button><button class="b p" onclick="go(3)">ไปขั้นตัดสาย ▶</button><span class="mut">pin ที่ยังไม่ตรง: ${errs()}</span>`;
if(n==6)return (S.pc?spark():'')+(S.log.length?`<pre class="term">${S.log.join('\n')}</pre>`:'')+(S.fdone?`<button class="b p" onclick="after()">${P.mode=='pvp'&&M.who==0?'ส่งต่อให้เพื่อน':P.mode=='ta'&&performance.now()-M.ta0<3e5?'สายถัดไป ▶ (เหลือ '+Math.round((3e5-performance.now()+M.ta0)/1000)+' วิ)':'ดูผลรวม'}</button>`:'');
return ''}
function draw(){if(P.scr!='play'||!S)return;$('#wo').textContent=`${M.wo} · ${CAB[P.cable].d} · Cat5e UTP · 🛠 ${gi('sp').lab}/${gi('ct').lab}/${gi('cr').lab}`;
$('#steps').innerHTML=STEPS.map((n,i)=>`<span class="${i+1==S.step?'on':i+1<S.step||S.step==6&&i<5?'done':''}">${n}</span>`).join('')+`<span>ปลาย ${Math.min(2,S.e+1)}/2</span>`;
$('#st').innerHTML=[0,d1,d2,d3,d4,d5,d6][S.step]()+hands();$('#say').textContent=S.msg;$('#face').innerHTML=face(S.mood);$('#ctl').innerHTML=ctl();const tm=$('.term');if(tm)tm.scrollTop=tm.scrollHeight}

/* ---------- ควบคุม ---------- */
function startHold(){S.holding=true;S.hold=0;last=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!S.holding)return;const dt=Math.min(.05,(t-last)/1000);last=t;S.hold=Math.min(1,S.hold+dt*.8*(S.step==5?gi('cr').spd:1));draw();requestAnimationFrame(loop)}
function anim(ms,f,cb){const t0=performance.now();(function k(t){const p=Math.min(1,(t-t0)/ms);f(p);draw();p<1?requestAnimationFrame(k):cb&&cb()})(t0)}
function pick(i){if(S.sel<0)S.sel=i;else{if(S.sel!=i){S.hist.push(S.order.slice());const o=S.order;[o[S.sel],o[i]]=[o[i],o[S.sel]];beep(520,.06)}S.sel=-1}}
function up1(){S.holding=false;const h=S.hold;
if(h<.55){S.hold=0;S.mood='oh';S.msg='ใบมีดยังไม่ทะลุปลอก! กดค้างนานขึ้นแล้วปล่อยในโซนเขียว'}
else{S.L=(600-S.bx)/6;S.nick=h>gi('sp').nk;S.done=1;const d=Math.abs(S.L-30);S.sc.strip=Math.max(0,Math.round(25-Math.min(25,d*gi('sp').sl)-(S.nick?8:0)));S.hold=0;beep(240,.12,'sawtooth');S.mood=S.nick||d>3?'oh':'happy';S.msg=(S.nick?'อุ๊ย ใบมีดลึกไป บาดทองแดงแล้ว! ':'ปอกปลอกสะอาด! ')+(d<=3?'ความยาว ~30 มม. กำลังดี':S.L>33?`ปอกยาวไป (${S.L.toFixed(0)} มม.)`:`ปอกสั้นไป (${S.L.toFixed(0)} มม.)`);pop(d<=3&&!S.nick?'PERFECT! +'+S.sc.strip:'+'+S.sc.strip,d<=3&&!S.nick?'#0a8f4d':'#d98a00');anim(700,p=>S.slide=p,()=>setTimeout(()=>go(2),700))}}
function doCut(){S.cut=1;const jx=600-S.L*6;S.cx=cl(S.cx,Math.min(600,jx+30),600);S.w=Math.min(S.L,(S.cx-jx)/6);const w=S.w;S.sc.cut=Math.max(0,Math.round(w>13+gi('ct').tol?20-(w-13-gi('ct').tol)*5:w<10.5-gi('ct').tol?20-(10.5-gi('ct').tol-w)*4:20));beep(900,.05);pop(S.sc.cut>=18?'CLEAN CUT! +'+S.sc.cut:'+'+S.sc.cut,S.sc.cut>=18?'#0a8f4d':'#d98a00');S.mood=S.sc.cut>=18?'happy':'oh';S.msg=S.sc.cut>=18?`ตัดได้ ${w.toFixed(1)} มม. อยู่ในมาตรฐาน ปลายเสมอสวย!`:w>13?`ตัดไว้ ${w.toFixed(1)} มม. เกินมาตรฐาน 13 มม.`:`ตัดไว้ ${w.toFixed(1)} มม. สั้นไปหน่อย`;setTimeout(()=>go(4),1300)}
function up5(){S.holding=false;const h=S.hold>=gi('cr').pf?Math.max(S.hold,.95):S.hold;
if(h<.7){S.hold=0;S.mood='oh';S.msg='ยังย้ำไม่สุด เข็มทองยังไม่จิกสาย ลองกดค้างอีกครั้ง'}
else{S.cdone=1;S.sc.crimp=h>=.95?15:8;beep(160,.15);pop(h>=.95?'CLICK! +15':'+8',h>=.95?'#0a8f4d':'#d98a00');S.mood='happy';S.msg=h>=.95?'กึก! ย้ำสุดแรงพอดี':'ย้ำได้แต่ไม่สุด เข็มอาจจิกไม่ลึกพอ';setTimeout(endDone,1100)}}
const st=$('#st'),pt=e=>{const r=st.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*720,y:(e.clientY-r.top)/r.height*320}};
st.onpointerdown=e=>{if(!S||P.scr!='play')return;const p=pt(e),n=S.step;try{st.setPointerCapture(e.pointerId)}catch(_){}
if(n==1&&!S.done&&!S.holding){S.bx=cl(p.x,300,590);startHold();beep(300,.05)}
else if(n==2&&S.tw<.02){const g=e.target.closest('[data-i]');if(g){S.dg=+g.dataset.i;S.dp=p;S.d0=p}}
else if(n==3&&!S.cut)S.cx=cl(p.x,Math.min(600,600-S.L*6+30),600);
else if(n==4&&!S.fin){S.drag=1;S.anc=p.x-S.ox}
else if(n==5&&!S.cdone&&!S.holding){startHold();beep(260,.05)}
else if(n==6){const g=e.target.closest('[data-pl]');if(g&&!S.testing){const i=+g.dataset.pl;S.pg=i;S.po={x:S.pp[i].x-p.x,y:S.pp[i].y-p.y};S.seat[i]=0;S.ready=0}else if(e.target.closest('[data-t]')&&S.ready&&!S.testing)runTest()}
draw()};
st.onpointermove=e=>{if(!S||P.scr!='play')return;const p=pt(e),n=S.step;
if(n==1&&!S.done&&!S.holding){S.bx=cl(p.x,300,590);draw()}
else if(n==2&&S.dg>=0){S.dp=p;draw()}
else if(n==3&&!S.cut){S.cx=cl(p.x,Math.min(600,600-S.L*6+30),600);draw()}
else if(n==4&&S.drag){S.ox=cl(p.x-S.anc,0,240);if(S.ox>=238){S.ox=240;S.drag=0;S.fin=1;S.sc.ins=S.w<=13.2?15:S.w<=15?8:3;beep(420,.1);S.mood=S.w>13.2?'sad':'happy';S.msg=S.w>13.2?'ปลายชนผนังแล้ว แต่ปลอกค้างอยู่นอกหัว สายคลายเกลียวยาวไป!':'เข้าหัวสนิท ปลายสายชนผนังหน้าครบ 8 เส้น!';setTimeout(()=>go(5),1300)}draw()}
else if(n==6&&S.pg>=0){S.pp[S.pg]={x:cl(p.x+S.po.x,20,700),y:cl(p.y+S.po.y,20,300)};draw()}};
st.onpointerup=st.onpointercancel=()=>{if(!S||P.scr!='play')return;const n=S.step;
if(n==1&&S.holding)up1();else if(n==3&&!S.cut)doCut();else if(n==4)S.drag=0;else if(n==5&&S.holding)up5();
else if(n==2&&S.dg>=0){const idx=cl(Math.round((S.dp.y-100)/17),0,7),mv=Math.hypot(S.dp.x-S.d0.x,S.dp.y-S.d0.y);if(mv<6)pick(S.dg);else if(idx!=S.dg){S.hist.push(S.order.slice());const o=S.order;[o[S.dg],o[idx]]=[o[idx],o[S.dg]];beep(520,.06)}S.dg=-1}
else if(n==6&&S.pg>=0){const sp=[{x:196,y:110},{x:524,y:110}][S.pg];if(Math.hypot(S.pp[S.pg].x-sp.x,S.pp[S.pg].y-sp.y)<50){S.pp[S.pg]={...sp};S.seat[S.pg]=1;beep(700,.06)}S.pg=-1;S.ready=S.seat[0]&&S.seat[1]?1:0;if(S.ready)S.msg='เสียบครบทั้งสองปลายแล้ว! กดปุ่ม TEST บนเครื่องเทสได้เลย'}
draw()};
render();
</script>
